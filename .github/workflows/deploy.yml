name: nick-site CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: nick-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test And Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nick-site-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      LOG_DRAIN_URL: ${{ secrets.LOG_DRAIN_URL }}
      LOG_DRAIN_TOKEN: ${{ secrets.LOG_DRAIN_TOKEN }}
      TRADING_KEYS_ENCRYPTION_KEY: ${{ secrets.TRADING_KEYS_ENCRYPTION_KEY }}
      CUSTOMER_PORTAL_PLANS_TABLE: ${{ secrets.CUSTOMER_PORTAL_PLANS_TABLE }}
      CUSTOMER_PORTAL_SUBSCRIPTIONS_TABLE: ${{ secrets.CUSTOMER_PORTAL_SUBSCRIPTIONS_TABLE }}
      CUSTOMER_PORTAL_STRICT_MODE: ${{ secrets.CUSTOMER_PORTAL_STRICT_MODE }}
      NCS_STATUS_ENDPOINT: ${{ secrets.NCS_STATUS_ENDPOINT }}
      NCS_STATUS_BEARER_TOKEN: ${{ secrets.NCS_STATUS_BEARER_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
      INSTAGRAM_APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
      INSTAGRAM_VERIFY_TOKEN: ${{ secrets.INSTAGRAM_VERIFY_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      INSTAGRAM_PAGE_ID: ${{ secrets.INSTAGRAM_PAGE_ID }}
      TIKTOK_APP_ID: ${{ secrets.TIKTOK_APP_ID }}
      TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_ADVERTISER_ID: ${{ secrets.TIKTOK_ADVERTISER_ID }}
      TIKTOK_PAGE_ID: ${{ secrets.TIKTOK_PAGE_ID }}
      TIKTOK_LEAD_LOOKBACK_DAYS: ${{ secrets.TIKTOK_LEAD_LOOKBACK_DAYS }}
      TRADING_EXCHANGE_ID: ${{ secrets.TRADING_EXCHANGE_ID }}
      TRADING_DEFAULT_SYMBOL: ${{ secrets.TRADING_DEFAULT_SYMBOL }}
      TRADING_TRADE_LIMIT: ${{ secrets.TRADING_TRADE_LIMIT }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET: ${{ secrets.BINANCE_SECRET }}
      BINANCE_SANDBOX: ${{ secrets.BINANCE_SANDBOX }}
      COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
      COINBASE_SECRET: ${{ secrets.COINBASE_SECRET }}
      TRADING_API_KEY: ${{ secrets.TRADING_API_KEY }}
      TRADING_SECRET: ${{ secrets.TRADING_SECRET }}
      TRADING_PASSWORD: ${{ secrets.TRADING_PASSWORD }}
      TRADING_UID: ${{ secrets.TRADING_UID }}
      TRADING_SANDBOX: ${{ secrets.TRADING_SANDBOX }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nick-site-dist
          path: dist

      - name: Install Wrangler v4
        run: npm install --no-save wrangler@4

      - name: Sync Pages Function Secrets
        shell: bash
        run: |
          set -euo pipefail

          put_pages_secret() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "$value" ]; then
              return 0
            fi

            printf '%s' "$value" | npx wrangler pages secret put "$key" --project-name "$PAGES_PROJECT"
          }

          for key in \
            SUPABASE_URL \
            SUPABASE_KEY \
            STRIPE_SECRET_KEY \
            OPENAI_API_KEY \
            OPENAI_MODEL \
            ANTHROPIC_API_KEY \
            ANTHROPIC_MODEL \
            LOG_LEVEL \
            LOG_DRAIN_URL \
            LOG_DRAIN_TOKEN \
            TRADING_KEYS_ENCRYPTION_KEY \
            CUSTOMER_PORTAL_PLANS_TABLE \
            CUSTOMER_PORTAL_SUBSCRIPTIONS_TABLE \
            CUSTOMER_PORTAL_STRICT_MODE \
            NCS_STATUS_ENDPOINT \
            NCS_STATUS_BEARER_TOKEN \
            META_APP_ID \
            META_APP_SECRET \
            META_VERIFY_TOKEN \
            META_ACCESS_TOKEN \
            META_AD_ACCOUNT_ID \
            META_PAGE_ID \
            INSTAGRAM_APP_ID \
            INSTAGRAM_APP_SECRET \
            INSTAGRAM_VERIFY_TOKEN \
            INSTAGRAM_ACCESS_TOKEN \
            INSTAGRAM_BUSINESS_ACCOUNT_ID \
            INSTAGRAM_PAGE_ID \
            TIKTOK_APP_ID \
            TIKTOK_APP_SECRET \
            TIKTOK_ACCESS_TOKEN \
            TIKTOK_ADVERTISER_ID \
            TIKTOK_PAGE_ID \
            TIKTOK_LEAD_LOOKBACK_DAYS \
            TRADING_EXCHANGE_ID \
            TRADING_DEFAULT_SYMBOL \
            TRADING_TRADE_LIMIT \
            BINANCE_API_KEY \
            BINANCE_SECRET \
            BINANCE_SANDBOX \
            COINBASE_API_KEY \
            COINBASE_SECRET \
            TRADING_API_KEY \
            TRADING_SECRET \
            TRADING_PASSWORD \
            TRADING_UID \
            TRADING_SANDBOX
          do
            put_pages_secret "$key"
          done

      - name: Sync Queue Consumer Worker Secrets
        shell: bash
        run: |
          set -euo pipefail

          put_worker_secret() {
            local key="$1"
            local value="${!key:-}"
            if [ -z "$value" ]; then
              return 0
            fi

            printf '%s' "$value" | npx wrangler secret put "$key" -c wrangler.ncs-consumer.toml
          }

          for key in \
            SUPABASE_URL \
            SUPABASE_KEY \
            LOG_LEVEL \
            LOG_DRAIN_URL \
            LOG_DRAIN_TOKEN
          do
            put_worker_secret "$key"
          done

      - name: Deploy Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch "${{ github.ref_name }}"

      - name: Deploy Queue Consumer Worker
        run: npx wrangler deploy -c wrangler.ncs-consumer.toml
